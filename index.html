<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Gracias por tu compra! - Master Vault VIP</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #020617; --accent: #fbbf24; --sky: #0ea5e9; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: white; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; text-align: center; }
        .success-card { background: rgba(255,255,255,0.05); padding: 40px 30px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.1); max-width: 450px; width: 100%; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .check-icon { font-size: 4rem; color: #22c55e; margin-bottom: 20px; }
        h1 { font-size: 1.8rem; margin-bottom: 10px; }
        p { opacity: 0.8; font-size: 0.9rem; margin-bottom: 30px; }
        
        .key-box { background: #0f172a; border: 2px dashed var(--accent); padding: 20px; border-radius: 15px; margin-bottom: 20px; min-height: 40px; display: flex; align-items: center; justify-content: center; }
        .key-text { font-size: 1.4rem; font-weight: 800; color: var(--accent); letter-spacing: 1px; }
        
        .btn { display: block; width: 100%; padding: 18px; border-radius: 15px; text-decoration: none; font-weight: 800; margin-bottom: 15px; transition: 0.3s; cursor: pointer; border: none; font-family: inherit; }
        .btn-copy { background: white; color: var(--bg); font-size: 0.9rem; }
        .btn-portal { background: var(--sky); color: white; font-size: 1.1rem; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .support { font-size: 0.75rem; opacity: 0.5; margin-top: 20px; }
        .loading-dots:after { content: ' .'; animation: dots 1s steps(5, end) infinite; }
        @keyframes dots { 0%, 20% { color: rgba(0,0,0,0); text-shadow: .5em 0 0 rgba(0,0,0,0), 1em 0 0 rgba(0,0,0,0); } 40% { color: var(--accent); text-shadow: .5em 0 0 rgba(0,0,0,0), 1em 0 0 rgba(0,0,0,0); } 60% { text-shadow: .5em 0 0 var(--accent), 1em 0 0 rgba(0,0,0,0); } 80%, 100% { text-shadow: .5em 0 0 var(--accent), 1em 0 0 var(--accent); } }
    </style>
</head>
<body>

<div class="success-card">
    <div class="check-icon">✅</div>
    <h1>¡Pago Confirmado!</h1>
    <p>Gracias por tu compra. Aquí tienes tu <b>clave única</b> de acceso. Guárdala bien:</p>

    <div class="key-box">
        <div class="key-text" id="accessKey"><span class="loading-dots">Generando acceso</span></div>
    </div>

    <button id="copyBtn" class="btn btn-copy" onclick="copyKey()" disabled>📋 COPIAR CLAVE</button>
    
    <a href="TU_PAGINA_DE_ACCESO.html" class="btn btn-portal">IR AL PORTAL VIP 🚀</a>

    <div class="support">
        Tu clave es personal y permite hasta 3 dispositivos.<br>
        ¿Problemas? <a href="https://wa.me/TUNUMERO" style="color:var(--accent)">Soporte WhatsApp</a>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, query, where, limit, getDocs, doc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAtjiAQgS2VjEwbHleBBUNm9EKx0tC9q7M",
        authDomain: "mibibliotecadigital-4ac7f.firebaseapp.com",
        projectId: "mibibliotecadigital-4ac7f",
        storageBucket: "mibibliotecadigital-4ac7f.firebasestorage.app",
        messagingSenderId: "654550297574",
        appId: "1:654550297574:web:dfdfefbd8954ad399b4427"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function entregarClave() {
        const keyDisplay = document.getElementById('accessKey');
        const copyBtn = document.getElementById('copyBtn');

        // 1. Verificar si ya le entregamos una clave en esta sesión (Memoria Local)
        const claveGuardada = localStorage.getItem('mi_clave_vip');
        if (claveGuardada) {
            keyDisplay.innerText = claveGuardada;
            copyBtn.disabled = false;
            return;
        }

        try {
            // 2. Buscar una clave disponible en Firestore
            const q = query(
                collection(db, "claves"), 
                where("estado", "==", "disponible"), 
                limit(1)
            );
            
            const querySnapshot = await getDocs(q);
            
            if (!querySnapshot.empty) {
                const docSnap = querySnapshot.docs[0];
                const claveID = docSnap.id;

                // 3. Marcarla como vendida inmediatamente
                const docRef = doc(db, "claves", claveID);
                await updateDoc(docRef, {
                    estado: "vendida",
                    fechaVenta: serverTimestamp()
                });

                // 4. Guardar en memoria del navegador y mostrar
                localStorage.setItem('mi_clave_vip', claveID);
                keyDisplay.innerText = claveID;
                copyBtn.disabled = false;

            } else {
                keyDisplay.innerText = "SIN CLAVES DISPONIBLES";
                alert("Inventario agotado. Por favor contacta a soporte con tu comprobante de pago.");
            }
        } catch (error) {
            console.error("Error:", error);
            keyDisplay.innerText = "ERROR DE SISTEMA";
        }
    }

    window.copyKey = function() {
        const text = document.getElementById('accessKey').innerText;
        navigator.clipboard.writeText(text).then(() => {
            alert("¡Clave única copiada!");
        });
    }

    entregarClave();
</script>

</body>
</html>
